# ============================================================
# Speed-ZeroBaran — Weekly Deep Lighthouse Audit
# A more thorough Lighthouse-CLI-based audit once a week.
# Author: Baran Avisat <Baranavisat@gmail.com>
# License: MIT
# ============================================================
name: Speed-ZeroBaran Deep Audit

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g lighthouse

      - name: 🔬 Run deep Lighthouse audit (both strategies)
        env:
          TARGET_SITES:        ${{ secrets.TARGET_SITES }}
          PAGESPEED_API_KEY:   ${{ secrets.PAGESPEED_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          AUDIT_STRATEGY:      desktop
        run: |
          python scripts/run_audit.py --strategy desktop --html
          python scripts/run_audit.py --strategy mobile  --html

      - name: 📤 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-zerobaran-deep-reports
          path: reports/
          retention-days: 90
          if-no-files-found: ignore
